name: Cleanup build artifacts

on:
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]

# После очистки повторять весь исходный workflow, включая сборку
jobs:
  cleanup:
    name: Delete successful run build artifacts
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete build artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const completedRun = context.payload.workflow_run;
            const run_id = completedRun.id;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id
            });

            // Не удаляем файлы, если после события уже начался повторный прогон
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.run_attempt !== completedRun.run_attempt) {
              core.info('Run is no longer the completed successful attempt; keeping artifacts');
              return;
            }

            const names = new Set(["vsix-package"]);
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id, per_page: 100 }
            );

            for (const artifact of artifacts) {
              if (artifact.expired || !names.has(artifact.name)) {
                continue;
              }

              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id
                });
                core.info(`Deleted ${artifact.name} (${artifact.id}) from run ${run_id}`);
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                core.info(`Artifact ${artifact.id} has already been removed`);
              }
            }
